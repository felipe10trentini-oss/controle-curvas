<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Curvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* Mesma identidade visual do Controle GLP */
  :root {
    --bg: #f2f2f0; --surface: #ffffff; --surface-2: #e7e7e5; --border: #d2d2cf; --text: #161616; --text-muted: #61615f;
    --accent: #c00000; --accent-ink: #ffffff; --good: #2f8f5b; --good-bg: #e3f3ea; --warn: #b8790f; --warn-bg: #faf0dc;
    --bad: #c00000; --bad-bg: #fbe4e4; --info: #1f5ea8; --info-bg: #e6f0fb;
    --shadow: 0 1px 2px rgba(10,10,10,.06), 0 4px 14px rgba(10,10,10,.06); --radius: 10px;
    --font-display: 'Barlow Condensed', sans-serif; --font-body: 'IBM Plex Sans', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --surface: #1c1c1c; --surface-2: #262626; --border: #3a3a3a; --text: #efefee; --text-muted: #a3a3a1;
      --accent: #e23a3a; --accent-ink: #160404; --good: #57b586; --good-bg: #1d3328; --warn: #e0a64a; --warn-bg: #3a2e17;
      --bad: #e23a3a; --bad-bg: #3a1c1c; --info: #7fb2f0; --info-bg: #172b45; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font-body); }
  .oculto { display: none !important; }
  /* login */
  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px; width: 100%; max-width: 360px; }
  .logos { display: flex; justify-content: center; align-items: center; gap: 14px; margin-bottom: 10px; }
  .logos img { height: 26px; }
  h1 { font: 700 22px var(--font-display); letter-spacing: .04em; text-transform: uppercase; text-align: center; margin: 6px 0 18px; }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); font: inherit; }
  button { padding: 9px 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 600 14px var(--font-body); cursor: pointer; }
  button.prim { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); width: 100%; margin-top: 16px; }
  .erro { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 18px; }
  /* app */
  header { background: var(--surface); box-shadow: var(--shadow); padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: sticky; top: 0; z-index: 20; }
  header .logos { margin: 0; }
  header h2 { font: 700 20px var(--font-display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  .upd { color: var(--text-muted); font-size: 12px; }
  .upd.velho { color: var(--bad); font-weight: 600; }
  header .dir { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  header a { color: var(--text-muted); font-size: 13px; text-decoration: none; }
  main { padding: 16px; max-width: 1500px; margin: 0 auto; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .abas { display: flex; flex-wrap: wrap; gap: 6px; }
  .abas button.on { background: var(--text); color: var(--surface); border-color: var(--text); }
  .barra .filtros { margin-left: auto; display: flex; gap: 8px; }
  .barra .filtros input { width: 200px; } .barra .filtros select { width: 150px; }
  [hidden] { display: none !important; }
  button.ign { margin-left: 8px; padding: 2px 8px; font-size: 11px; border: 1px solid var(--border, #c9c9c4); border-radius: 6px; background: transparent; color: var(--text-muted, #666); cursor: pointer; white-space: nowrap; }
  button.ign:hover { background: var(--surface-2); color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 2px; padding: 1px 2px 1px 7px; border: 1px solid var(--border, #c9c9c4); border-radius: 999px; background: var(--surface-2); font: 600 12px var(--font-mono, monospace); }
  .chip button.ign { margin: 0; padding: 0 6px; border: 0; border-radius: 999px; font-size: 14px; line-height: 18px; color: var(--text-muted, #666); }
  .chip button.ign:hover { background: var(--accent); color: #fff; }
  /* faixa que separa um RT do outro (Relatorios 2026 e Programacoes) */
  tr.grupo td { background: var(--surface-2); color: var(--text); font: 700 11.5px var(--font-body); letter-spacing: .1em; text-transform: uppercase; text-align: left; padding: 7px 10px; border-top: 0; border-bottom: 1px solid var(--surface-2); }
  .rel tr.grupo td, .emp.prog tr.grupo td, .emp.pet tr.grupo td { text-align: left; padding: 7px 10px; white-space: nowrap; }
  .ctl-topo { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; } .ctl-topo select { width: auto; }
  .ctl-sub { margin: 18px 2px 8px; font: 600 15px var(--font-body); }
  tr.tot td { background: var(--surface-2); }
  td.tot-dia { font-weight: 700; background: var(--surface-2); }
  .caixa { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; max-height: calc(100vh - 150px); }   /* rola dentro da caixa: o cabecalho da tabela fica fixo */
  .caixa.vazio { max-height: none; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--surface-2); text-align: left; white-space: nowrap; }
  th { font: 600 11px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); background: var(--surface); position: sticky; top: 0; z-index: 2; }
  td.n { text-align: center; font: 600 15px var(--font-mono); }
  td.n.ren { background: var(--warn-bg); color: var(--warn); }
  td.n.cer { background: var(--info-bg); color: var(--info); }
  td.n.sal { background: var(--good-bg); color: var(--good); }
  td.atraso { color: var(--bad); font-weight: 600; }
  td.aviso { background: var(--bad-bg); color: var(--bad); line-height: 1.25; }
  td.aviso small { display: block; font-size: 11.5px; color: var(--text-muted); font-weight: 500; }
  small.agenda { display: block; font-size: 11.5px; color: var(--text-muted); font-style: italic; }
  /* Peticionamento / Programacoes / Relatorios */
  .emp.pet table, .emp.prog table { table-layout: fixed; width: 100%; }
  .emp.pet th, .emp.pet td, .emp.prog th, .emp.prog td { white-space: normal; padding: 4px 5px; }
  .emp.pet input, .emp.prog input { min-width: 0; width: 100%; }
  .emp.prog { overflow-x: auto; } .emp.prog table { min-width: 1150px; }
  .emp.prog th { font-size: 10px; padding: 8px 3px; text-align: center; }
  .emp.prog th:nth-child(1) { width: 6%; } .emp.prog th:nth-child(2) { width: 12%; } .emp.prog th:nth-child(3) { width: 11%; } .emp.prog th:nth-child(4) { width: 16%; }
  .emp.prog td:nth-child(3) input, .emp.prog td:nth-child(4) input { font-size: 12px; padding: 6px 4px; }
  .emp.prog th:last-child { width: 34px; }
  .emp.prog input.mes { text-align: center; padding: 6px 2px; font-size: 12px; font-weight: 600; }
  .emp.prog input.v-ok { background: var(--good-bg); color: var(--good); } .emp.prog input.v-nd { background: var(--surface-2); color: var(--text-muted); }
  .emp .del { padding: 2px 6px; font-size: 16px; line-height: 1; color: var(--text-muted); }
  .caixa.rel { overflow-x: auto; } .rel table { table-layout: fixed; width: 100%; min-width: 1050px; }
  .rel th, .rel td { padding: 5px 3px; text-align: center; white-space: nowrap; }
  .rel td.emp-nome, .rel th:nth-child(2), .rel th:nth-child(1), .rel th:nth-child(3) { text-align: left; }
  .rel td.emp-nome { padding-left: 8px; white-space: normal; font-size: 13px; }
  .rel th { font-size: 10.5px; } .rel th.atual { color: var(--accent); }
  .rel col.c-rt { width: 6.5%; } .rel col.c-emp { width: 13%; } .rel col.c-st { width: 6%; } .rel col.c-sei { width: 12.5%; } .rel col.c-m { width: 4.7%; }
  .rel input.rt, .rel input.sei { min-width: 0; width: 100%; padding: 4px 5px; font-size: 12px; }
  .rel select.st { width: 100%; min-width: 0; padding: 4px 2px; font-size: 12px; font-weight: 700; text-align: center; text-align-last: center; cursor: pointer; }
  .rel select.st.st-ok { background: var(--good-bg); color: var(--good); border-color: var(--good); }
  .rel select.st.st-sa { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
  .rel select.st.st-x { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); font-size: 10.5px; }
  .rel th:nth-child(3), .rel th:nth-child(4) { text-align: center; white-space: normal; }
  .rel input.sei { font-family: var(--font-mono); font-size: 11px; }
  .rel td.rm { font-size: 11px; font-weight: 600; }
  .rel td.rm.ok { background: var(--good-bg); color: var(--good); }
  .rel td.rm.rel { background: var(--info-bg); color: var(--info); }
  .rel td.rm.fec { background: var(--warn-bg); color: var(--warn); }
  label.so-pend { display: flex; gap: 6px; align-items: center; margin: 10px 2px 0; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text); }
  label.so-pend input { width: auto; }
  /* PRIORIDADE: campo vermelho em cima do cabecalho do "O que fazer" */
  .prioridade { display: flex; align-items: stretch; background: var(--accent); position: sticky; top: 0; z-index: 4; }   /* fica fixa no topo ao rolar */
  .fazer th { top: var(--prio-h, 0px); }
  .prioridade label { display: flex; align-items: center; margin: 0; padding: 0 16px; color: var(--accent-ink); font: 700 15px var(--font-display); letter-spacing: .14em; text-transform: none; }
  .prioridade textarea { flex: 1; min-height: 40px; max-height: 40vh; border: 0; border-radius: 0; background: var(--bad-bg); color: var(--bad); font: 600 14px/1.4 var(--font-body); padding: 10px 14px; resize: none; overflow: auto; }
  .prioridade textarea::placeholder { color: var(--bad); opacity: .5; font-weight: 500; }
  .prioridade textarea:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* O que fazer: cabe na largura da tela (sem rolagem para o lado); textos quebram em linhas */
  .caixa.fazer { overflow-x: hidden; }
  .fazer table { table-layout: fixed; width: 100%; }
  .fazer th, .fazer td { white-space: normal; overflow-wrap: anywhere; padding: 8px 8px; vertical-align: top; }
  .fazer th { font-size: 10.5px; letter-spacing: .03em; }
  .fazer col.c-emp { width: 22%; } .fazer col.c-resp { width: 10%; } .fazer col.c-aviso { width: 26%; }
  .fazer col.c-n { width: 10%; } .fazer col.c-esp { width: 12%; }
  .fazer td.n { font-size: 14px; }
  @media (max-width: 700px) {
    .fazer th, .fazer td { padding: 6px 4px; font-size: 12px; }
    .fazer th { font-size: 9.5px; }
    .fazer col.c-emp { width: 24%; } .fazer col.c-aviso { width: 31%; }
    .fazer col.c-n { width: 11%; } .fazer col.c-esp { width: 12%; }
    .fazer td.aviso small, .fazer small.agenda { font-size: 10.5px; }
  }
  tr.com-aviso td:first-child { border-left: 4px solid var(--accent); }
  .vazio { padding: 28px; text-align: center; color: var(--text-muted); }
  .legenda { font-size: 12px; color: var(--text-muted); margin: 10px 2px; }
  /* grade (controle de curvas) */
  .grade { max-height: 75vh; }
  .grade table { width: auto; }
  .grade th, .grade td { padding: 5px 8px; font-size: 12.5px; border-left: 1px solid var(--surface-2); text-align: center; }
  .grade .fx { position: sticky; background: var(--surface); text-align: left; z-index: 1; }
  .grade th.fx { z-index: 3; }
  .grade .c1 { left: 0; min-width: 190px; } .grade .c2 { left: 190px; min-width: 92px; } .grade .c3 { left: 282px; min-width: 52px; } .grade .c4 { left: 334px; min-width: 70px; border-right: 2px solid var(--border); }
  .grade td.v { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  .grade td.m { background: var(--surface-2); color: var(--text-muted); }
  .grade td.x { color: var(--border); }
  .grade tr.prim td { border-top: 2px solid var(--border); }
  /* empresas */
  .emp td { padding: 4px 6px; }
  .emp input, .emp select { padding: 6px 8px; font-size: 13px; min-width: 110px; }
  .emp .nome { font-weight: 600; padding: 4px 10px; }
  .senha { display: flex; gap: 4px; } .senha button { padding: 4px 8px; font-size: 12px; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--text); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-weight: 600; opacity: 0; transition: opacity .2s; z-index: 50; }
  .toast.on { opacity: 1; }
  .novo { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; padding: 12px; border-bottom: 1px solid var(--surface-2); }
  .novo div { min-width: 180px; }
  @media (max-width: 700px) { .barra .filtros { margin-left: 0; width: 100%; } .barra .filtros input, .barra .filtros select { width: 100%; } }
</style>
</head>
<body>

<!-- ============ LOGIN (mesmos colaboradores da Emissão de Certificados) ============ -->
<div id="telaLogin" class="login oculto">
  <form class="card" id="formLogin">
    <div class="logos"><img src="logo-mann.png" alt="MANN"><img src="logo-exata.png" alt="EXATA"></div>
    <h1>Controle de Curvas</h1>
    <label for="login">Login</label><input id="login" type="text" autocomplete="username" autocapitalize="none" required>
    <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required>
    <button class="prim" type="submit">Entrar</button>
    <div class="erro" id="erroLogin"></div>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="telaApp" class="oculto">
  <header>
    <div class="logos"><img src="logo-mann.png" alt="MANN"><img src="logo-exata.png" alt="EXATA"></div>
    <h2>Controle de Curvas</h2>
    <span class="upd" id="upd"></span>
    <div class="dir"><span class="upd" id="quem"></span><button id="sair">Sair</button></div>
  </header>
  <main>
    <div class="barra">
      <div class="abas" id="abas">
        <button data-aba="fazer" class="on">O que fazer</button>
        <button data-aba="grade">Controle de curvas</button>
        <button data-aba="faltando">Curvas faltando</button>
        <button data-aba="empresas">Empresas</button>
        <button data-aba="peticionamento">Peticionamento SEI</button>
        <button data-aba="relatorios">Relatórios 2026</button>
        <button data-aba="programacoes">Programações</button>
        <button data-aba="controladoria" id="abaControladoria" hidden>Controladoria</button>
      </div>
      <div class="filtros">
        <input id="busca" type="search" placeholder="Buscar empresa">
        <select id="resp"><option value="">Todos</option></select>
      </div>
    </div>
    <div id="conteudo"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://vjbyyjfmilmeyzeiinxf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HgnI-KSEvq1PJet6fmrV_g_MRf6HK4M";   // mesma chave publica do Controle GLP
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ANO = new Date().getFullYear();
let aba = "fazer";
const dados = { fazer: [], faltando: [], empresas: [], curvas: null, sync: null };

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1800); }
const passaFiltro = (emp, resp) => {
  const q = $("busca").value.trim().toLowerCase(), r = $("resp").value;
  return (!q || emp.toLowerCase().includes(q)) && (!r || (r === "-" ? !resp : resp === r));
};
const respDe = emp => (dados.empresas.find(e => e.nome === emp) || {}).responsavel || "";

/* ---------------- login ---------------- */
// Cada colaborador entra com o login e a senha da Emissão de Certificados (conferidos em /api/login).
// Sessões antigas do login único da equipe são encerradas; a sessão vale um turno (12 h), como lá.
const DOMINIO_COLABORADOR = "@colaborador.controle-curvas.vercel.app";
const CONTROLADORIA = ["camila", "felipe"];   // logins com acesso a aba Controladoria (e aos botoes Desconsiderar)
let podeAjustar = false;
const VALIDADE_MS = 12 * 60 * 60 * 1000;
const loginEm = () => { try { return Number(localStorage.getItem("curvas_login_em")) || 0; } catch (e) { return 0; } };
async function iniciar() {
  const { data } = await sb.auth.getSession();
  const s = data.session;
  const valida = s && (s.user.email || "").endsWith(DOMINIO_COLABORADOR) && Date.now() - loginEm() < VALIDADE_MS;
  if (s && !valida) await sb.auth.signOut();
  if (!valida) { $("telaLogin").classList.remove("oculto"); $("telaApp").classList.add("oculto"); return; }
  $("quem").textContent = (s.user.user_metadata || {}).nome || "";
  const loginAtual = String((s.user.user_metadata || {}).login || (s.user.email || "").split("@")[0]).toLowerCase();
  $("abaControladoria").hidden = !CONTROLADORIA.includes(loginAtual);   // Controladoria: so Camila e Felipe
  podeAjustar = CONTROLADORIA.includes(loginAtual);
  $("telaLogin").classList.add("oculto"); $("telaApp").classList.remove("oculto");
  await carregar(); setInterval(carregar, 120000);   // atualiza a cada 2 minutos
}
$("formLogin").onsubmit = async ev => {
  ev.preventDefault(); $("erroLogin").textContent = "";
  const botao = ev.target.querySelector("button"); botao.disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ login: $("login").value.trim(), senha: $("senha").value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $("erroLogin").textContent = d.error || "Não foi possível entrar."; return; }
    const { error } = await sb.auth.setSession({ access_token: d.access_token, refresh_token: d.refresh_token });
    if (error) { $("erroLogin").textContent = "Não foi possível abrir a sessão."; return; }
    try { localStorage.setItem("curvas_login_em", String(Date.now())); } catch (e) {}
    iniciar();
  } catch (e) {
    $("erroLogin").textContent = "Sem conexão. Tente de novo.";
  } finally { botao.disabled = false; }
};
$("sair").onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------------- dados ---------------- */
async function carregar() {
  const [s, f, fa, e, pr] = await Promise.all([
    sb.from("curvas_sync").select("*").eq("id", 1).maybeSingle(),
    sb.from("curvas_o_que_fazer").select("*"),
    sb.from("curvas_faltando").select("*").limit(2000),
    sb.from("curvas_empresas").select("*").order("nome"),
    sb.from("curvas_prioridade").select("*").eq("id", 1).maybeSingle(),   // fora da checagem de erro: sem a tabela a pagina continua funcionando
  ]);
  const erro = [s, f, fa, e].find(x => x.error);
  if (erro) { $("conteudo").innerHTML = `<div class="caixa vazio">Não foi possível carregar os dados: ${esc(erro.error.message)}</div>`; return; }
  dados.sync = s.data; dados.fazer = f.data || []; dados.faltando = fa.data || []; dados.empresas = e.data || [];
  if (pr && !pr.error) dados.prioridade = (pr.data && pr.data.texto) || "";
  montarFiltroResp(); mostrarAtualizacao();
  // recarga automatica so redesenha as abas de consulta (nas abas editaveis, ou com a prioridade sendo digitada, apagaria o texto)
  const digitando = document.activeElement && document.activeElement.id === "prioridade";
  if ((aba === "fazer" && !digitando) || aba === "faltando" || !carregar.feito) render();
  carregar.feito = true;
}
async function carregarCurvas() {   // todas as curvas do ano (pagina de 1000 em 1000)
  const lista = [];
  for (let de = 0; ; de += 1000) {
    const { data, error } = await sb.from("curvas").select("empresa,estufa,ciclo,sigla,coletada_em,emitida_em,salva_em,origem")
      .gte("coletada_em", `${ANO}-01-01`).order("coletada_em").range(de, de + 999);
    if (error) throw error;
    lista.push(...data); if (data.length < 1000) break;
  }
  dados.curvas = lista;
}
function montarFiltroResp() {
  const sel = $("resp"), atual = sel.value;
  const nomes = [...new Set(dados.empresas.map(e => e.responsavel).filter(Boolean))].sort();
  sel.innerHTML = `<option value="">Todos</option>` + nomes.map(n => `<option>${esc(n)}</option>`).join("") + `<option value="-">Sem responsável</option>`;
  sel.value = atual;
}
function mostrarAtualizacao() {
  const el = $("upd"); if (!dados.sync) { el.textContent = ""; return; }
  const min = Math.round((Date.now() - new Date(dados.sync.atualizado_em)) / 60000);
  el.textContent = min < 1 ? "Atualizado agora" : `Atualizado há ${min} min`;
  el.classList.toggle("velho", min > 20);
  if (min > 20) el.textContent += " — o computador que envia os dados pode estar desligado";
}

/* ---------------- abas ---------------- */
$("abas").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; aba = b.dataset.aba; document.querySelectorAll("#abas button").forEach(x => x.classList.toggle("on", x === b)); delete cacheTab[aba]; render(); };   // ao abrir uma aba editavel, le de novo do banco
$("busca").oninput = () => render();
window.matchMedia("(max-width: 700px)").addEventListener("change", () => { if (aba === "fazer") renderFazer(); });   // girou o celular / mudou a janela
$("resp").onchange = () => render();

async function render() {
  $("resp").style.display = ["peticionamento", "relatorios", "programacoes"].includes(aba) ? "none" : "";   // essas abas nao usam o filtro de responsavel
  if (aba === "fazer") renderFazer();
  else if (aba === "faltando") renderFaltando();
  else if (aba === "empresas") renderEmpresas();
  else if (aba === "peticionamento") renderTabela("peticionamento");
  else if (aba === "programacoes") renderTabela("programacoes");
  else if (aba === "relatorios") renderRelatorios();
  else if (aba === "grade" || aba === "controladoria") {
    if (!dados.curvas) { $("conteudo").innerHTML = `<div class="caixa vazio">Carregando o controle de curvas…</div>`; try { await carregarCurvas(); } catch (e) { $("conteudo").innerHTML = `<div class="caixa vazio">Erro: ${esc(e.message)}</div>`; return; } }
    if (aba === "grade") renderGrade();
    else if (!$("abaControladoria").hidden) renderControladoria();
  }
}

/* ---------------- controladoria (so Camila e Felipe) ---------------- */
let ctlDias = 30;
function renderControladoria() {
  const sd = s => s ? new Date(s).toLocaleDateString("sv-SE") : "";            // dia local aaaa-mm-dd
  const fmt = d => { const [y, m, dd] = d.split("-"); return `${dd}/${m}`; };
  const cs = dados.curvas.filter(c => !c.sigla && passaFiltro(c.empresa, respDe(c.empresa)))
    .map(c => ({ ...c, b: sd(c.coletada_em), e: sd(c.emitida_em), s: sd(c.salva_em), raiz: c.origem === "raiz", resp: respDe(c.empresa) || "Sem responsável" }));
  const hoje = sd(new Date().toISOString());
  const dias = []; for (let i = 0; i < ctlDias; i++) { const d = new Date(); d.setDate(d.getDate() - i); dias.push(d.toLocaleDateString("sv-SE")); }
  const INICIO = "2026-10-01";   // o monitor acompanha o que fica pendente desde esta data
  const n = (arr, f) => arr.reduce((t, c) => t + (f(c) ? 1 : 0), 0);
  const semCertEm = d => d >= INICIO ? n(cs, c => c.raiz && c.b <= d && (!c.e || c.e > d) && !(c.s && c.s <= d)) : null;   // salva sem certificado registrado = concluida
  const diaAnterior = d => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() - 1); return x.toLocaleDateString("sv-SE"); };
  const linhas = dias.map(d => {
    const obs = d >= INICIO, baixadas = n(cs, c => c.b === d);
    const sobraram = semCertEm(diaAnterior(d));   // pendentes no fim do dia anterior
    return { d, baixadas, sobraram, total: sobraram === null ? null : sobraram + baixadas,
      emitidas: n(cs, c => c.e === d), salvas: n(cs, c => c.s === d),
      semCert: obs ? semCertEm(d) : null,
      semSalvar: obs ? n(cs, c => c.raiz && c.b <= d && (!c.s || c.s > d)) : null };
  });
  const tot = k => linhas.reduce((t, l) => t + l[k], 0);
  const min = dias[dias.length - 1];
  const respNomes = [...new Set(cs.map(c => c.resp))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  const porResp = respNomes.map(r => { const x = cs.filter(c => c.resp === r);
    return { r, baixadas: n(x, c => c.b >= min && c.b <= hoje), emitidas: n(x, c => c.e >= min && c.e <= hoje), salvas: n(x, c => c.s >= min && c.s <= hoje),
      semCert: n(x, c => c.raiz && !c.e && !c.s), semSalvar: n(x, c => c.raiz && !c.s) }; });
  const pend = cs.filter(c => c.raiz && !c.e && !c.s).map(c => ({ ...c, dias: Math.max(0, Math.round((new Date(hoje) - new Date(c.b)) / 864e5)) }))
    .sort((a, b) => b.dias - a.dias || a.empresa.localeCompare(b.empresa, "pt-BR"));
  const cel = v => v === null ? `<td class="n">—</td>` : `<td class="n">${v}</td>`;
  const soma = k => porResp.reduce((t, r) => t + r[k], 0);
  $("conteudo").innerHTML = `
    <div class="ctl-topo"><label>Período</label>
      <select id="ctlPeriodo">${[7, 15, 30, 60, 90].map(v => `<option value="${v}" ${v === ctlDias ? "selected" : ""}>Últimos ${v} dias</option>`).join("")}</select></div>
    <div class="caixa"><table>
      <tr><th>Responsável</th><th>Baixadas</th><th>Certificados emitidos</th><th>Salvas na empresa</th><th>Sem certificado hoje</th><th>Sem salvar hoje</th></tr>
      ${porResp.map(r => `<tr><td><b>${esc(r.r)}</b></td>${cel(r.baixadas)}${cel(r.emitidas)}${cel(r.salvas)}${cel(r.semCert)}${cel(r.semSalvar)}</tr>`).join("")}
      <tr class="tot"><td><b>Total</b></td>${cel(soma("baixadas"))}${cel(soma("emitidas"))}${cel(soma("salvas"))}${cel(soma("semCert"))}${cel(soma("semSalvar"))}</tr>
    </table></div>
    <div class="caixa" style="margin-top:14px"><table>
      <tr><th>Dia</th><th>Sobraram do dia anterior</th><th>Baixadas no dia</th><th>Total a certificar (sobraram + baixadas)</th><th>Certificados emitidos</th><th>Salvas na empresa</th><th>Ficaram sem certificado (fim do dia)</th><th>Ficaram sem salvar (fim do dia)</th></tr>
      ${linhas.map(l => `<tr><td>${fmt(l.d)}${l.d === hoje ? " (hoje)" : ""}</td>${cel(l.sobraram)}${cel(l.baixadas)}<td class="n tot-dia">${l.total === null ? "—" : l.total}</td>${cel(l.emitidas)}${cel(l.salvas)}${cel(l.semCert)}${cel(l.semSalvar)}</tr>`).join("")}
      <tr class="tot"><td><b>Total do período</b></td><td></td>${cel(tot("baixadas"))}<td></td>${cel(tot("emitidas"))}${cel(tot("salvas"))}<td></td><td></td></tr>
    </table></div>
    <h3 class="ctl-sub">Curvas paradas agora — sem certificado (${pend.length})</h3>
    <div class="caixa"><table>
      <tr><th>Empresa</th><th>Responsável</th><th>Curva</th><th>Baixada em</th><th>Dias parada</th></tr>
      ${pend.map(c => `<tr><td><b>${esc(c.empresa)}</b></td><td>${esc(c.resp)}</td><td>${esc(c.estufa ?? "—")}-${esc(c.ciclo)}</td><td>${fmt(c.b)}</td><td class="n ${c.dias >= 2 ? "atraso" : ""}">${c.dias}</td></tr>`).join("") || `<tr><td colspan="5">Nenhuma curva parada.</td></tr>`}
    </table></div>
    <div class="legenda">Baixadas = curvas coletadas no dia. Certificados emitidos e Salvas = o que foi feito no dia, qualquer que seja o dia da baixada. "Sobraram do dia anterior" = curvas que ficaram sem certificado no fim do dia anterior; "Total a certificar" = sobraram + baixadas no dia. "Ficaram sem certificado/salvar" = o que ainda estava pendente no fim de cada dia (contado desde 01/10/2026, quando o monitor passou a acompanhar). "Por quem" = responsável da empresa no cadastro. Cancelamentos (CM/CE/R/MI) não entram na conta.</div>`;
  $("ctlPeriodo").onchange = ev => { ctlDias = Number(ev.target.value); renderControladoria(); };
}
/* ---------------- desconsiderar avisos e ciclos faltando (Camila e Felipe) ---------------- */
const avisosOcultos = new Set();
$("conteudo").addEventListener("click", async ev => {
  const b = ev.target.closest("button.ign"); if (!b || !podeAjustar) return;
  if (b.classList.contains("ign-av")) {
    const nums = b.dataset.com.split(",").map(s => s.trim()).filter(Boolean);
    if (!confirm(`Desconsiderar o(s) comunicado(s) ${nums.join(", ")} de ${b.dataset.emp}?\n\nEles saem da lista de avisos (não serão cobrados).`)) return;
    b.disabled = true;
    const { error } = await sb.from("curvas_avisos_ignorados").insert(nums.map(n => ({ empresa: b.dataset.emp, comunicado: Number(n), criado_por: ($("quem").textContent || "").trim() })));
    if (error) { b.disabled = false; toast("Não foi possível salvar: " + error.message); return; }
    nums.forEach(n => avisosOcultos.add(b.dataset.emp + "|" + n));
    toast("Desconsiderado. O monitor confirma em até 5 minutos."); renderFazer();
  } else if (b.classList.contains("ign-fa")) {
    if (!confirm(`Desconsiderar os ciclos ${b.dataset.ciclos} de ${b.dataset.emp}${b.dataset.est ? " (estufa " + b.dataset.est + ")" : ""}?\n\nEles saem de "Curvas faltando".`)) return;
    b.disabled = true;
    const linha = { empresa: b.dataset.emp, ate_ciclo: Number(b.dataset.ate) }; if (b.dataset.est) linha.estufa = b.dataset.est;
    const { error } = await sb.from("curvas_ignorar_faltando").insert(linha);
    if (error) { b.disabled = false; toast("Não foi possível salvar: " + error.message); return; }
    dados.faltando = dados.faltando.filter(r => !(r.empresa === b.dataset.emp && String(r.estufa ?? "") === b.dataset.est));
    toast("Desconsiderado."); renderFaltando();
  }
});
function renderFazer() {
  // empresas com aviso primeiro (ordem alfabetica), depois as outras (ordem alfabetica)
  const semOcultos = r => {   // comunicados desconsiderados nesta sessao somem na hora (o monitor confirma em ate 5 min)
    if (!r.aviso_comunicado) return r;
    const nums = String(r.aviso_comunicado).split(",").map(s => s.trim()).filter(s => s && !avisosOcultos.has(r.empresa + "|" + s));
    return { ...r, aviso_comunicado: nums.length ? nums.join(", ") : null, aviso_qtd: nums.length };
  };
  const rows = dados.fazer.map(semOcultos).filter(r => passaFiltro(r.empresa, r.responsavel))
    .sort((a, b) => (!a.aviso_comunicado - !b.aviso_comunicado) || a.empresa.localeCompare(b.empresa, "pt-BR"));
  const horas = r => r.esperando_desde ? (Date.now() - new Date(r.esperando_desde)) / 36e5 : 0;
  const n = (v, cls) => v ? `<td class="n ${cls}">${v}</td>` : `<td></td>`;
  const dia = s => new Date(s).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  // "1626, 1627, ..., 1639" -> "1626 a 1639" (numeros em sequencia viram intervalo)
  const intervalos = txt => {
    const ns = String(txt).split(",").map(s => s.trim()).filter(Boolean);
    if (ns.some(s => !/^\d+$/.test(s))) return ns.join(", ");
    const v = ns.map(Number).sort((a, b) => a - b), out = [];
    for (let i = 0; i < v.length; i++) { let j = i; while (j + 1 < v.length && v[j + 1] === v[j] + 1) j++; out.push(j - i >= 2 ? `${v[i]} a ${v[j]}` : v.slice(i, j + 1).join(", ")); i = j; }
    return out.join(", ");
  };
  const aviso = r => {
    // agendados resumidos: quantidade + o proximo; a lista completa aparece ao passar o mouse
    const ag = r.agendado_comunicado ? r.agendado_comunicado.split(", ") : [];
    const agenda = ag.length
      ? `<small class="agenda" title="${esc(r.agendado_comunicado)}">Agendado${ag.length > 1 ? `s (${ag.length})` : ""} · ${ag.length > 1 ? "próximo " : ""}${esc(ag[0].split(" · ")[1] || ag[0])}</small>` : "";
    if (!r.aviso_comunicado) return agenda ? `<td>${agenda}</td>` : `<td></td>`;
    const qtd = r.aviso_qtd || 1;
    if (podeAjustar) {   // cada comunicado e uma etiqueta com um X: desconsidera so aquele
      const nums = String(r.aviso_comunicado).split(",").map(s => s.trim()).filter(Boolean);
      const chips = nums.map(n => `<span class="chip">${esc(n)}<button type="button" class="ign ign-av" data-emp="${esc(r.empresa)}" data-com="${esc(n)}" title="Desconsiderar só o comunicado ${esc(n)}">×</button></span>`).join("");
      return `<td class="aviso"><b>Baixar ciclo${qtd > 1 ? ` (${qtd})` : ""}</b><small>desde ${dia(r.aviso_em)} · clique no × para desconsiderar só aquele</small><div class="chips">${chips}</div>${agenda}</td>`;
    }
    return `<td class="aviso"><b>Baixar ciclo${qtd > 1 ? ` (${qtd})` : ""}</b><small>Comunicado${qtd > 1 ? "s" : ""} ${esc(intervalos(r.aviso_comunicado))} · desde ${dia(r.aviso_em)}</small>${agenda}</td>`;
  };
  const celular = window.matchMedia("(max-width: 700px)").matches;   // no celular nao mostra a coluna Responsavel
  $("conteudo").innerHTML = rows.length ? `<div class="caixa fazer">${prioridadeHtml()}<table>
    <colgroup><col class="c-emp">${celular ? "" : `<col class="c-resp">`}<col class="c-aviso"><col class="c-n"><col class="c-n"><col class="c-n"><col class="c-esp"></colgroup>
    <tr><th>Empresa</th>${celular ? "" : "<th>Responsável</th>"}<th>Aviso</th><th>Renomear</th><th>Certificar</th><th>Salvar</th><th>Aguardando salvamento</th></tr>
    ${rows.map(r => `<tr class="${r.aviso_comunicado ? "com-aviso" : ""}"><td><b>${esc(r.empresa)}</b></td>${celular ? "" : `<td>${esc(r.responsavel) || "—"}</td>`}${aviso(r)}
      ${n(r.renomear, "ren")}${n(r.fazer_certificado, "cer")}${n(r.salvar_no_mes, "sal")}
      <td class="${horas(r) >= 24 ? "atraso" : ""}">${esc(r.esperando_ha) || "—"}</td></tr>`).join("")}</table></div>
    <div class="legenda">Aviso = comunicado na pasta da empresa. O sistema lê a data e o horário do tratamento no PDF: antes do horário aparece como "Agendado"; depois, "Baixar ciclo". Cada curva colada depois do início do tratamento resolve um comunicado (o mais antigo primeiro).<br>
    Números = quantidade de curvas esperando cada tarefa. Em vermelho: esperando há mais de 24 horas.</div>`
    : `<div class="caixa fazer">${prioridadeHtml()}</div><div class="caixa vazio">Nada pendente. Tudo em dia!</div>`;
  ligarPrioridade();
}

// Campo PRIORIDADE (vermelho, em cima do cabecalho): texto livre, salvo no banco e igual para todos
const prioridadeHtml = () => `<div class="prioridade"><label for="prioridade">PRIORIDADE</label><textarea id="prioridade" rows="1" placeholder="Escreva aqui as prioridades…">${esc(dados.prioridade)}</textarea></div>`;
function ligarPrioridade() {
  const ta = $("prioridade"); if (!ta) return;
  const faixa = ta.closest(".prioridade"), caixa = ta.closest(".caixa");
  const ajusta = () => {
    ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px";
    if (faixa && caixa) caixa.style.setProperty("--prio-h", faixa.offsetHeight + "px");   // o cabecalho da tabela fica logo abaixo da prioridade fixa
  };
  ajusta(); ta.oninput = ajusta;
  ta.onchange = async () => {
    const texto = ta.value.trim();
    const { error } = await sb.from("curvas_prioridade").upsert({ id: 1, texto, atualizado_em: new Date().toISOString() });
    if (error) { toast("Erro ao salvar a prioridade: " + error.message); return; }
    dados.prioridade = texto; toast("Prioridade salva");
  };
}

function renderFaltando() {
  const rows = dados.faltando.filter(r => passaFiltro(r.empresa, r.responsavel));
  const grupos = new Map();
  for (const r of rows) { const k = r.empresa + "|" + (r.estufa ?? ""); if (!grupos.has(k)) grupos.set(k, { ...r, ciclos: [] }); grupos.get(k).ciclos.push(r.ciclo_faltando); }
  $("conteudo").innerHTML = grupos.size ? `<div class="caixa"><table>
    <tr><th>Empresa</th><th>Responsável</th><th>Estufa</th><th>Ciclos faltando</th>${podeAjustar ? "<th></th>" : ""}</tr>
    ${[...grupos.values()].map(g => `<tr><td><b>${esc(g.empresa)}</b></td><td>${esc(g.responsavel) || "—"}</td><td>${g.estufa ?? "—"}</td><td class="atraso">${g.ciclos.join(", ")}</td>${podeAjustar ? `<td><button type="button" class="ign ign-fa" data-emp="${esc(g.empresa)}" data-est="${esc(g.estufa ?? "")}" data-ate="${Math.max(...g.ciclos.map(Number))}" data-ciclos="${esc(g.ciclos.join(", "))}">Desconsiderar</button></td>` : ""}</tr>`).join("")}</table></div>
    <div class="legenda">Ciclos que pularam na sequência, contando a partir de 01/10/2026. Para resolver: cole a curva na pasta da empresa, ou o arquivo de marcação — CM 3-297 (cancelado Marrari), CE 3-297 (cancelado Exata), R 3-297 (ressecagem), MI 3-297 (mercado interno).</div>`
    : `<div class="caixa vazio">Nenhuma curva faltando.</div>`;
}

function renderGrade() {
  const cs = dados.curvas.filter(c => passaFiltro(c.empresa, respDe(c.empresa)));
  const dia = c => c.coletada_em.slice(0, 10);
  const dias = [...new Set(cs.map(dia))].sort();
  const linhas = new Map();
  for (const c of cs) {
    const k = c.empresa + "|" + (c.estufa ?? "");
    if (!linhas.has(k)) linhas.set(k, { emp: c.empresa, e: c.estufa, cel: {}, ult: null });
    const L = linhas.get(k); (L.cel[dia(c)] = L.cel[dia(c)] || []).push(c);
    if (L.ultN == null || Number(c.ciclo) >= L.ultN) { L.ultN = Number(c.ciclo); L.ult = c.sigla ? `${c.ciclo} ${c.sigla}` : c.ciclo; }   // a ultima e o maior ciclo (os ciclos seguem em sequencia); conta mesmo cancelado (ex.: 431 CE)
  }
  const ord = [...linhas.values()].sort((a, b) => a.emp.localeCompare(b.emp, "pt-BR") || (a.e ?? 0) - (b.e ?? 0));
  const cab = d => { const [y, m, dd] = d.split("-"); return `${dd}/${m}`; };
  let ant = null;
  $("conteudo").innerHTML = ord.length ? `<div class="caixa grade" id="gradeBox"><table>
    <tr><th class="fx c1">Empresa</th><th class="fx c2">Resp.</th><th class="fx c3">Estufa</th><th class="fx c4">Última</th>${dias.map(d => `<th>${cab(d)}</th>`).join("")}</tr>
    ${ord.map(L => { const prim = L.emp !== ant; ant = L.emp;
      return `<tr class="${prim ? "prim" : ""}"><td class="fx c1">${prim ? `<b>${esc(L.emp)}</b>` : ""}</td><td class="fx c2">${prim ? esc(respDe(L.emp)) : ""}</td><td class="fx c3">${L.e ?? "—"}</td><td class="fx c4"><b>${L.ult ?? "—"}</b></td>` +
        dias.map(d => { const v = L.cel[d]; if (!v) return `<td class="x">-</td>`;
          const so = v.every(x => x.sigla); return `<td class="${so ? "m" : "v"}">${v.map(x => x.sigla ? `${x.ciclo} ${x.sigla}` : x.ciclo).join("; ")}</td>`; }).join("") + `</tr>`; }).join("")}
    </table></div><div class="legenda">Cada célula = ciclo(s) da curva baixada naquele dia. Cinza = marcação (CM/CE cancelado, R ressecagem, MI mercado interno).</div>`
    : `<div class="caixa vazio">Nenhuma curva em ${ANO}.</div>`;
  const box = $("gradeBox"); if (box) box.scrollLeft = box.scrollWidth;   // abre nos dias mais recentes
}

/* ---------------- empresas (cadastro editavel) ---------------- */
const CAMPOS = [["responsavel", "Responsável"], ["sistema", "Sistema"], ["acesso_id", "ID"], ["acesso_senha", "Senha"], ["contato", "Contato"], ["telefone", "Telefone"], ["email", "E-mail"]];
function renderEmpresas() {
  const rows = dados.empresas.filter(e => passaFiltro(e.nome, e.responsavel));
  const resps = [...new Set(dados.empresas.map(e => e.responsavel).filter(Boolean))].sort();
  const campo = (e, [k]) => {
    if (k === "responsavel") return `<select data-nome="${esc(e.nome)}" data-campo="${k}"><option value=""></option>${resps.map(r => `<option ${r === e.responsavel ? "selected" : ""}>${esc(r)}</option>`).join("")}</select>`;
    return `<input value="${esc(e[k])}" data-nome="${esc(e.nome)}" data-campo="${k}">`;
  };
  $("conteudo").innerHTML = `<div class="caixa emp">
    <form class="novo" id="formNovo">
      <div><label>Nova empresa (nome igual ao da pasta no OneDrive)</label><input id="novoNome" required></div>
      <div><label>Responsável</label><select id="novoResp"><option value=""></option>${resps.map(r => `<option>${esc(r)}</option>`).join("")}</select></div>
      <button type="submit">Adicionar</button>
    </form>
    <table><tr><th>Empresa</th>${CAMPOS.map(c => `<th>${c[1]}</th>`).join("")}<th>Ativa</th></tr>
    ${rows.map(e => `<tr><td class="nome">${esc(e.nome)}</td>${CAMPOS.map(c => `<td>${campo(e, c)}</td>`).join("")}
      <td><input type="checkbox" ${e.ativa ? "checked" : ""} data-nome="${esc(e.nome)}" data-campo="ativa" style="width:auto"></td></tr>`).join("")}
    </table></div>
    <div class="legenda">As alterações são salvas sozinhas ao sair do campo. "Ativa" desmarcada = a empresa some do controle.</div>`;
  document.querySelectorAll(".emp [data-campo]").forEach(el => el.onchange = salvarCampo);
  $("formNovo").onsubmit = async ev => {
    ev.preventDefault();
    const nome = $("novoNome").value.trim(); if (!nome) return;
    const { error } = await sb.from("curvas_empresas").insert({ nome, responsavel: $("novoResp").value || null });
    if (error) { toast(error.code === "23505" ? "Essa empresa já existe" : "Erro: " + error.message); return; }
    toast("Empresa adicionada"); await carregar();
  };
}
async function salvarCampo(ev) {
  const el = ev.target, nome = el.dataset.nome, campo = el.dataset.campo;
  const valor = el.type === "checkbox" ? el.checked : (el.value.trim() || null);
  const { error } = await sb.from("curvas_empresas").update({ [campo]: valor, atualizado_em: new Date().toISOString() }).eq("nome", nome);
  if (error) { toast("Erro ao salvar: " + error.message); return; }
  const e = dados.empresas.find(x => x.nome === nome); if (e) e[campo] = valor;
  toast("Salvo");
  if (campo === "responsavel") montarFiltroResp();
}

/* ---------------- Peticionamento SEI e Programacoes (tabelas editaveis) ---------------- */
const MESES = ["JAN", "FEV", "MAR", "ABR", "MAI", "JUN", "JUL", "AGO", "SET", "OUT", "NOV", "DEZ"];
const TABELAS = {
  peticionamento: { tabela: "curvas_peticionamento", ordem: "id", classe: "pet",
    colunas: [["empresa", "Empresa"], ["credenciamento", "SEI - Credenciamento"], ["relatorios", "SEI - Relatórios"]],
    nova: { empresa: "Nova empresa" }, nome: r => r.empresa, texto: "Números dos processos SEI de cada empresa." },
  programacoes: { tabela: "curvas_programacoes", ordem: "id", classe: "prog",
    colunas: [["rt", "RT"], ["empresa", "Empresa"], ["assinado", "OK / Assinado"], ["sei_peticionamento", "SEI - Peticionamento"], ["m00", "Conferência"],
      ...MESES.map((m, i) => ["m" + String(i + 1).padStart(2, "0"), m])],
    nova: { empresa: "Nova empresa" }, nome: r => r.empresa, texto: "Programações mensais. Conferência: OK quando ela é realizada. OK em verde, \"-\" em cinza." },
};
const cacheTab = {};
async function renderTabela(chave) {
  const cfg = TABELAS[chave];
  if (!cacheTab[chave]) {
    $("conteudo").innerHTML = `<div class="caixa vazio">Carregando…</div>`;
    const { data, error } = await sb.from(cfg.tabela).select("*").order(cfg.ordem, { ascending: true }).order("id");
    if (error) { $("conteudo").innerHTML = `<div class="caixa vazio">Erro: ${esc(error.message)}</div>`; return; }
    cacheTab[chave] = data;
    if (aba !== chave) return;
  }
  const q = $("busca").value.trim().toLowerCase();
  const rows = cacheTab[chave].filter(r => !q || cfg.colunas.slice(0, 4).some(([k]) => String(r[k] ?? "").toLowerCase().includes(q)));
  const cel = (r, [k]) => {
    const v = r[k] ?? "", mes = /^m\d\d$/.test(k);
    return `<td><input class="${mes ? "mes " + (v === "OK" ? "v-ok" : v === "-" ? "v-nd" : "") : ""}" value="${esc(v)}" data-id="${r.id}" data-campo="${k}"></td>`;
  };
  $("conteudo").innerHTML = `<div class="caixa emp ${cfg.classe}">
    <div class="novo"><button type="button" id="addLinha">+ Nova linha</button></div>
    <table><tr>${cfg.colunas.map(c => `<th>${c[1]}</th>`).join("")}<th></th></tr>
    ${rows.map((r, i) => `${cfg.colunas[0][0] === "rt" && (i === 0 || String(r.rt || "").trim().toLowerCase() !== String(rows[i - 1].rt || "").trim().toLowerCase()) ? `<tr class="grupo"><td colspan="${cfg.colunas.length + 1}">${esc(r.rt || "Sem RT")}</td></tr>` : ""}<tr>${cfg.colunas.map(c => cel(r, c)).join("")}<td><button type="button" class="del" data-id="${r.id}" title="Excluir linha">×</button></td></tr>`).join("")}
    </table></div>
    <div class="legenda">${rows.length} linhas. ${cfg.texto} As alterações são salvas sozinhas ao sair do campo. A busca procura na empresa e nas primeiras colunas.</div>`;
  document.querySelectorAll(".emp input[data-id]").forEach(el => el.onchange = async () => {
    const valor = el.value.trim() || null;
    const { error } = await sb.from(cfg.tabela).update({ [el.dataset.campo]: valor, atualizado_em: new Date().toISOString() }).eq("id", el.dataset.id);
    if (error) { toast("Erro ao salvar: " + error.message); return; }
    const r = cacheTab[chave].find(x => String(x.id) === el.dataset.id); if (r) r[el.dataset.campo] = valor;
    if (el.classList.contains("mes")) { el.classList.toggle("v-ok", valor === "OK"); el.classList.toggle("v-nd", valor === "-"); }
    toast("Salvo");
  });
  document.querySelectorAll(".emp .del").forEach(b => b.onclick = async () => {
    const r = cacheTab[chave].find(x => String(x.id) === b.dataset.id);
    if (!confirm(`Excluir a linha "${cfg.nome(r) || ""}"?`)) return;
    const { error } = await sb.from(cfg.tabela).delete().eq("id", b.dataset.id);
    if (error) { toast("Erro ao excluir: " + error.message); return; }
    cacheTab[chave] = cacheTab[chave].filter(x => x !== r); toast("Excluída"); renderTabela(chave);
  });
  $("addLinha").onclick = async () => {
    const { data, error } = await sb.from(cfg.tabela).insert({ ...cfg.nova }).select().single();
    if (error) { toast("Erro: " + error.message); return; }
    cacheTab[chave].push(data); $("busca").value = ""; renderTabela(chave); toast("Linha criada no final — preencha os campos");   // mesma ordem da planilha: novas linhas no fim
    setTimeout(() => { const inp = [...document.querySelectorAll(".emp tr")].pop()?.querySelector("input"); if (inp) { inp.scrollIntoView({ block: "center" }); inp.focus(); inp.select(); } }, 50);
  };
}

/* ---------------- Relatorios 2026 (fechamento, relatorio e recibo de cada mes) ---------------- */
let soPendencia = false;
// OK (verde) / S/A (amarelo); qualquer outro valor que ja esteja preenchido (ex.: EMBARGADA, CANCELADO) aparece em vermelho
const stClasse = v => !v ? "" : v === "OK" ? "st-ok" : v === "S/A" ? "st-sa" : "st-x";
const stSelect = (e, campo) => {
  const v = e[campo] || "", ops = ["", "OK", "S/A"]; if (v && !ops.includes(v)) ops.push(v);
  return `<select class="st ${stClasse(v)}" data-nome="${esc(e.nome)}" data-campo="${campo}">${ops.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
};
async function renderRelatorios() {
  if (!cacheTab.relatorios) {
    $("conteudo").innerHTML = `<div class="caixa vazio">Carregando…</div>`;
    const [rel, pet] = await Promise.all([sb.from("curvas_relatorios").select("*").eq("ano", ANO), sb.from("curvas_peticionamento").select("*")]);
    if (rel.error) { $("conteudo").innerHTML = `<div class="caixa vazio">Erro: ${esc(rel.error.message)}</div>`; return; }
    cacheTab.relatorios = rel.data; cacheTab.relatoriosPet = pet.data || [];
    if (aba !== "relatorios") return;
  }
  // SEI - Relatorio de cada empresa = o mesmo numero da aba Peticionamento SEI (ligado por empresa_pasta, ou pelo nome igual)
  const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const petDe = nome => cacheTab.relatoriosPet.find(p => p.empresa_pasta === nome) || cacheTab.relatoriosPet.find(p => !p.empresa_pasta && norm(p.empresa) === norm(nome));
  const porEmp = new Map();
  for (const r of cacheTab.relatorios) { if (!porEmp.has(r.empresa)) porEmp.set(r.empresa, {}); porEmp.get(r.empresa)[r.mes] = r; }
  const hoje = new Date(), mesAtual = hoje.getFullYear() > ANO ? 12 : hoje.getMonth() + 1;
  const d = s => s ? new Date(s).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : "";
  // estado do mes: OK (recibo) > Rel. OK (relatorio) > FECHADA (primeiro certificado do mes seguinte) > vazio
  const estado = r => !r ? null : r.recibo_em ? "ok" : r.relatorio_em ? "rel" : r.fechada_em ? "fec" : null;
  const pendente = (emp) => { const m = porEmp.get(emp.nome) || {}; return Object.keys(m).some(k => +k <= mesAtual && estado(m[k]) && estado(m[k]) !== "ok"); };
  const q = $("busca").value.trim().toLowerCase();
  let rows = dados.empresas.filter(e => e.ativa && e.ordem_rel !== 0 && (!q || e.nome.toLowerCase().includes(q) || (e.rt || "").toLowerCase().includes(q)));
  if (soPendencia) rows = rows.filter(pendente);
  // mesma ordem da aba RELATORIOS 2026 da Planilha Geral (ordem_rel); empresas fora dela vao para o fim, em ordem alfabetica
  rows = [...rows].sort((a, b) => (a.ordem_rel ?? 1e9) - (b.ordem_rel ?? 1e9) || a.nome.localeCompare(b.nome, "pt-BR"));
  const rts = [...new Set(dados.empresas.map(e => e.rt).filter(Boolean))].sort();
  const normRt = s => String(s || "").trim().toLowerCase();
  const TXT = { ok: "OK", rel: "Rel. OK", fec: "FECHADA" };
  const celula = (emp, mes) => {
    const r = (porEmp.get(emp.nome) || {})[mes], st = estado(r);
    if (!st) return `<td class="rm"></td>`;
    const dicas = [r.fechada_em && `Fechada em ${d(r.fechada_em)}`, r.relatorio_em && `Relatório em ${d(r.relatorio_em)}`, r.recibo_em && `Recibo em ${d(r.recibo_em)}`].filter(Boolean).join(" · ");
    return `<td class="rm ${st}" title="${esc(dicas)}">${TXT[st]}</td>`;
  };
  $("conteudo").innerHTML = `<div class="caixa rel"><table>
    <colgroup><col class="c-rt"><col class="c-emp"><col class="c-st"><col class="c-st"><col class="c-sei">${MESES.map(() => `<col class="c-m">`).join("")}</colgroup>
    <tr><th>RT</th><th>Empresa</th><th>Conferência</th><th>Status</th><th>SEI - Relatório</th>${MESES.map((m, i) => `<th class="${i + 1 === mesAtual ? "atual" : ""}">${m}</th>`).join("")}</tr>
    ${rows.map((e, i) => `${i === 0 || normRt(e.rt) !== normRt(rows[i - 1].rt) ? `<tr class="grupo"><td colspan="${5 + MESES.length}">${esc(e.rt || "Sem RT")}</td></tr>` : ""}<tr><td><input list="listaRt" class="rt" value="${esc(e.rt)}" data-nome="${esc(e.nome)}"></td><td class="emp-nome"><b>${esc(e.nome)}</b></td>
      <td>${stSelect(e, "conferencia_rel")}</td><td>${stSelect(e, "status_rel")}</td>
      <td><input class="sei" value="${esc((petDe(e.nome) || {}).relatorios)}" data-nome="${esc(e.nome)}"></td>${MESES.map((m, i) => celula(e, i + 1)).join("")}</tr>`).join("")}
    </table><datalist id="listaRt">${rts.map(r => `<option value="${esc(r)}">`).join("")}</datalist></div>
    <label class="so-pend"><input type="checkbox" id="soPend" ${soPendencia ? "checked" : ""}> mostrar só empresas com pendência</label>
    <div class="legenda"><b>FECHADA</b> = já existe um certificado do mês seguinte (o sistema lê a "Data do início do tratamento" escrita dentro do certificado), hora de fazer o relatório ·
    <b>Rel. OK</b> = o relatório do mês apareceu na pasta Relatórios · <b>OK</b> = o recibo do peticionamento apareceu na mesma pasta.
    Os meses são preenchidos sozinhos pelo sistema; passe o mouse sobre a célula para ver as datas. RT e SEI - Relatório são editáveis aqui (o SEI é o mesmo número da aba Peticionamento SEI).</div>`;
  $("soPend").onchange = ev => { soPendencia = ev.target.checked; renderRelatorios(); };
  document.querySelectorAll("input.rt").forEach(el => el.onchange = async () => {
    const valor = el.value.trim() || null;
    const { error } = await sb.from("curvas_empresas").update({ rt: valor, atualizado_em: new Date().toISOString() }).eq("nome", el.dataset.nome);
    if (error) { toast("Erro ao salvar: " + error.message); return; }
    const e = dados.empresas.find(x => x.nome === el.dataset.nome); if (e) e.rt = valor; toast("Salvo");
  });
  // Conferencia e Status (OK / S/A), coloridos
  document.querySelectorAll("select.st").forEach(el => el.onchange = async () => {
    const valor = el.value || null, campo = el.dataset.campo;
    const { error } = await sb.from("curvas_empresas").update({ [campo]: valor, atualizado_em: new Date().toISOString() }).eq("nome", el.dataset.nome);
    if (error) { toast("Erro ao salvar: " + error.message); return; }
    el.className = "st " + stClasse(valor);
    const e = dados.empresas.find(x => x.nome === el.dataset.nome); if (e) e[campo] = valor; toast("Salvo");
  });
  // SEI - Relatorio: grava na linha do Peticionamento SEI (cria a linha se a empresa ainda nao tiver)
  document.querySelectorAll("input.sei").forEach(el => el.onchange = async () => {
    const valor = el.value.trim() || null, nome = el.dataset.nome, atual = petDe(nome);
    let error;
    if (atual) ({ error } = await sb.from("curvas_peticionamento").update({ relatorios: valor, atualizado_em: new Date().toISOString() }).eq("id", atual.id));
    else {
      const nova = { empresa: nome, relatorios: valor }; if (cacheTab.relatoriosPet.length && "empresa_pasta" in cacheTab.relatoriosPet[0]) nova.empresa_pasta = nome;
      const r = await sb.from("curvas_peticionamento").insert(nova).select().single(); error = r.error; if (!error) cacheTab.relatoriosPet.push(r.data);
    }
    if (error) { toast("Erro ao salvar: " + error.message); return; }
    if (atual) atual.relatorios = valor; delete cacheTab.peticionamento; toast("Salvo");
  });
}

iniciar();
</script>
